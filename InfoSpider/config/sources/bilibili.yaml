# B站爬虫配置

source_name: bilibili
source_type: video
enabled: true

# 速率限制
rate_limit:
  requests_per_minute: 30
  retry_on_failure: true
  max_retries: 3

# 搜索配置
search:
  default_keywords:
    - 编程
    - 游戏开发
    - AI
    - 科技
  batch_size: 20
  order: totalrank  # totalrank / click / pubdate / dm / stow

# 过滤配置
filters:
  min_view: 10000
  min_like: 500
  min_duration_seconds: 60
  max_duration_seconds: 7200
  blacklist_authors: []
  blacklist_keywords:
    - 广告
    - 推广
