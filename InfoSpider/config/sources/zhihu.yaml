# 知乎爬虫配置

source_name: zhihu
source_type: feed
enabled: true

# 速率限制
rate_limit:
  requests_per_minute: 20
  retry_on_failure: true
  max_retries: 3

# 浏览器配置
browser:
  headless: true
  user_data_dir: data/browser/zhihu

# 搜索配置
search:
  default_keywords:
    - 热门
    - 高赞
    - 程序员
    - AI
    - 游戏开发
  batch_size: 20

# 过滤配置
filters:
  min_upvote: 100
  min_char_count: 100
  blacklist_authors: []
  blacklist_keywords:
    - 广告
    - 推广
    - 加微信
    - 购买链接
  spam_keywords:
    - 美容
    - 护肤
    - 减肥
    - 代购
